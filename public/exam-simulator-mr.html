<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>術科測驗模擬器 — 無人多旋翼機基本級未達 2 公斤</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#0a0a1a;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;touch-action:none;
  user-select:none;-webkit-user-select:none}
#c{position:absolute;top:0;left:0;display:block}

/* Callout */
#callout{position:absolute;top:14px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.88);border:2px solid #4caf50;padding:9px 22px;
  border-radius:9px;white-space:pre-line;font-size:1.05rem;font-weight:600;
  max-width:55vw;text-align:center;z-index:30;pointer-events:none;
  transition:border-color .25s,color .25s}
#callout.hi{border-color:#ffc107;color:#ffd54f}

#countdown{position:absolute;top:92px;left:50%;transform:translateX(-50%);
  min-width:92px;padding:10px 18px;border-radius:999px;
  background:rgba(0,0,0,.82);border:2px solid rgba(255,255,255,.35);
  text-align:center;font-size:2rem;font-weight:800;letter-spacing:.06em;
  z-index:31;pointer-events:none;display:none}
#countdown.go{color:#ffd54f;border-color:#ffc107}

/* Step list */
#steps{position:absolute;left:8px;top:8px;width:190px;background:rgba(0,0,0,.82);
  border-radius:10px;overflow:hidden;z-index:20}
#shdr{background:#1565c0;padding:9px 14px;font-weight:700;font-size:.85rem}
.si{display:flex;align-items:center;gap:8px;padding:6px 11px;cursor:pointer;
  font-size:.74rem;border-bottom:1px solid rgba(255,255,255,.07);transition:background .15s}
.si:hover{background:rgba(255,255,255,.1)}
.si.on{background:rgba(76,175,80,.22);color:#a5d6a7}
.sid{width:22px;height:22px;border-radius:50%;flex-shrink:0;
  background:rgba(255,255,255,.13);display:flex;align-items:center;
  justify-content:center;font-size:.62rem;font-weight:700}
.si.on .sid{background:#4caf50;color:#fff}

/* Mode button */
#modebtn{padding:5px 13px;background:rgba(0,0,0,.78);
  border:1px solid rgba(255,255,255,.3);border-radius:18px;cursor:pointer;
  font-size:.76rem;z-index:20;color:#fff}
#modebtn.manual{background:rgba(255,140,0,.25);border-color:#ff8c00;color:#ffc04a}

/* Playback bar */
#ply{position:absolute;bottom:76px;left:50%;transform:translateX(-50%);
  display:flex;gap:8px;z-index:20}
.pb{padding:5px 13px;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.22);
  border-radius:7px;cursor:pointer;font-size:.8rem;color:#fff}
.pb:hover{background:rgba(255,255,255,.18)}
.pb.pri{background:rgba(21,101,192,.85);border-color:#42a5f5}

/* Camera buttons */
#cams{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  display:flex;flex-wrap:wrap;justify-content:center;gap:5px;z-index:20;max-width:92vw}
.cb{padding:4px 10px;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.28);
  border-radius:18px;cursor:pointer;font-size:.72rem;color:#bbb;
  transition:all .2s;white-space:nowrap;touch-action:manipulation}
.cb.on{background:#1565c0;color:#fff;border-color:#42a5f5}
.cb:hover:not(.on){background:rgba(255,255,255,.14);color:#fff}

/* Right-side panel stack (keyhint / opcamctl / stat) — top-right, hidden by default */
#right-panels{position:absolute;right:8px;top:50px;display:none;flex-direction:column;gap:6px;z-index:20}

/* Status HUD */
#stat{background:rgba(0,0,0,.72);
  padding:7px 11px;border-radius:8px;font-size:.7rem;
  pointer-events:none;line-height:1.95}
#stat b{color:#4fc3f7}

#opcamctl{background:rgba(0,0,0,.74);
  padding:6px 8px;border-radius:8px;font-size:.64rem;
  line-height:1.45;min-width:136px}
#opcamctl label{display:block;color:#ddd}
#opcamctl .val{color:#4fc3f7;font-weight:700}
#opcamctl input[type="range"]{width:100%}



/* Keyboard hint (manual mode) */
#keyhint{background:rgba(0,0,0,.72);
  padding:7px 12px;border-radius:8px;font-size:.67rem;color:#aaa;
  pointer-events:none;line-height:2;display:none}
#keyhint b{color:#fff}

/* PiP frames */
.pf{position:absolute;border:1.5px solid rgba(255,255,255,.35);border-radius:4px;
  z-index:19;pointer-events:none}
.pl{position:absolute;font-size:.62rem;color:rgba(255,255,255,.9);
  background:rgba(0,0,0,.65);padding:2px 6px;border-radius:3px;
  z-index:21;pointer-events:none}

/* Split-view labels */
.slbl{position:absolute;font-size:.64rem;color:rgba(255,255,255,.75);
  background:rgba(0,0,0,.55);padding:3px 7px;border-radius:3px;
  z-index:22;pointer-events:none;display:none}

/* FPV crosshair */
#fpvhud{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  pointer-events:none;z-index:22;display:none}

/* Virtual joystick zones (shown in manual mode) */
.joy-zone{position:fixed;bottom:60px;width:130px;height:130px;border-radius:50%;
  background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);
  z-index:40;display:none;touch-action:none}
#zoneL{left:16px}
#zoneR{right:16px}

/* Portrait orientation warning */
#orient-warn{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);
  color:#fff;z-index:9999;justify-content:center;align-items:center;
  text-align:center;font-size:1.15rem;padding:24px;line-height:1.8}
@media screen and (orientation:portrait){#orient-warn{display:flex}}

/* ── Step panel floating toggle (always visible) ── */
#steps-toggle{display:block;position:absolute;left:8px;top:8px;z-index:25;
  width:34px;height:34px;border-radius:8px;background:rgba(0,0,0,.85);
  border:1px solid rgba(255,255,255,.3);color:#fff;font-size:1rem;
  cursor:pointer;line-height:34px;text-align:center;padding:0;
  touch-action:manipulation}

/* ── HUD toggle (always visible, top-right) ── */
#hud-toggle{display:block;position:absolute;right:8px;top:8px;z-index:25;
  width:34px;height:34px;border-radius:8px;background:rgba(0,0,0,.85);
  border:1px solid rgba(255,255,255,.3);color:#fff;font-size:1rem;
  cursor:pointer;line-height:34px;text-align:center;padding:0;
  touch-action:manipulation}

/* ── Small landscape (phone ≤ 500 px tall) ── */
@media screen and (max-height:500px) and (orientation:landscape){
  /* Shift step panel below the toggle */
  #steps{top:50px;width:170px}
  #shdr{padding:6px 10px;font-size:.78rem}
  .si{padding:5px 9px;font-size:.67rem}
  .sid{width:18px;height:18px;font-size:.55rem}

  /* Callout + countdown: smaller */
  #callout{font-size:.8rem;padding:5px 14px;max-width:44vw;top:8px}
  #countdown{font-size:1.35rem;padding:5px 11px;min-width:58px;top:50px}

  /* Bottom controls: tighter */
  .cb,#modebtn{padding:3px 7px;font-size:.62rem}
  .pb{padding:3px 9px;font-size:.68rem}
  #ply{bottom:72px;gap:4px}
  #cams{bottom:4px;gap:3px;max-width:98vw}

  /* Joystick zones: smaller */
  .joy-zone{width:100px;height:100px;bottom:38px}

  /* Right HUD panels: smaller text */
  #stat{font-size:.6rem;padding:5px 8px;line-height:1.65}
  #opcamctl{font-size:.6rem;padding:5px 7px;min-width:116px}
  #keyhint{font-size:.6rem;padding:5px 10px;line-height:1.85}
}
</style>
</head>
<body>
<div id="orient-warn">🔄 請將裝置旋轉為橫向<br>以獲得最佳體驗</div>
<canvas id="c"></canvas>

<div id="callout">載入中…</div>
<div id="countdown"></div>

<button id="steps-toggle" onclick="toggleSteps()" title="開啟/關閉流程面板">📋</button>
<button id="hud-toggle" onclick="toggleHud()" title="開啟/關閉 HUD 面板">📊</button>

<div id="steps">
  <div id="shdr">📋 術科測驗流程</div>
</div>

<div id="ply">
  <button class="pb" onclick="stepNav(-1)">◀ 上一步</button>
  <button class="pb pri" id="bPlay" onclick="togglePlay()">⏸ 暫停</button>
  <button class="pb" onclick="stepNav(1)">下一步 ▶</button>
</div>

<div id="cams">
  <button id="modebtn" onclick="toggleMode()">🕹 手動模式</button>
  <button class="cb on"  id="cam-op"  onclick="setMainCam('op')">👁 操作者</button>
  <button class="cb"     id="cam-fpv" onclick="setMainCam('fpv')">🎥 無人機</button>
  <button class="cb"     id="cam-top" onclick="setMainCam('top')">🗺 上視圖</button>
  <button class="cb"     id="cam-all" onclick="setMainCam('all')">⊞ 三視圖</button>
</div>

<div id="right-panels">
  <div id="keyhint">
    <b>W/S</b> 前進／後退 &nbsp; <b>A/D</b> 左右平移<br>
    <b>Q/E</b> 偏航旋轉 &nbsp; <b>Space</b> 上升<br>
    <b>Shift</b> 下降
  </div>
  <div id="opcamctl">
    <label>操作者視角高度：<span class="val" id="opEyeVal">1.70</span> m</label>
    <input id="opEye" type="range" min="1.40" max="1.90" step="0.01" value="1.70">
  </div>
  <div id="stat">
    高度：<b id="sAlt">0.0</b> m<br>
    速度：<b id="sSpd">0.0</b> m/s<br>
    航向：<b id="sHdg">180</b>°<br>
    模式：<b id="sMode">手動</b>
  </div>
</div>

<!-- PiP outlines -->
<div class="pf" id="pf1"></div>
<div class="pf" id="pf2"></div>
<div class="pl" id="pl1"></div>
<div class="pl" id="pl2"></div>

<!-- Split-view labels -->
<div class="slbl" id="sl-op">👁 操作者視角</div>
<div class="slbl" id="sl-top">🗺 上視圖</div>
<div class="slbl" id="sl-fpv">🎥 無人機視角</div>

<!-- FPV HUD crosshair -->
<div id="fpvhud">
  <svg width="58" height="58" viewBox="0 0 58 58">
    <line x1="29" y1="3"  x2="29" y2="19" stroke="rgba(255,255,255,.55)" stroke-width="1.5"/>
    <line x1="29" y1="39" x2="29" y2="55" stroke="rgba(255,255,255,.55)" stroke-width="1.5"/>
    <line x1="3"  y1="29" x2="19" y2="29" stroke="rgba(255,255,255,.55)" stroke-width="1.5"/>
    <line x1="39" y1="29" x2="55" y2="29" stroke="rgba(255,255,255,.55)" stroke-width="1.5"/>
    <circle cx="29" cy="29" r="4.5" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.5"/>
  </svg>
</div>

<!-- Virtual joystick zones (shown in manual mode, powered by nipplejs) -->
<div class="joy-zone" id="zoneL"></div>
<div class="joy-zone" id="zoneR"></div>

<script>
'use strict'

// ═══════════════════════════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════════════════════════
const FLY_ALT = 1.5   // exam flight altitude 1–2 m; use midpoint
const OP_Z    = 3.25  // operator position per field diagram
const REC_W   = 12    // rectangle width per spec
const REC_D   = 5     // rectangle depth per spec
const FIELD_W = 15    // square field width/depth per spec
const FIELD_HALF = FIELD_W / 2
const FIELD_NORTH_Z = -8.5
const FIELD_SOUTH_Z = 6.5
const FIELD_CENTER_Z = (FIELD_NORTH_Z + FIELD_SOUTH_Z) / 2
const HW      = REC_W / 2   // = 6
const PI      = Math.PI
let opEyeHeight = 1.7

// ═══════════════════════════════════════════════════════════════
//  THREE.JS SETUP
// ═══════════════════════════════════════════════════════════════
const canvas   = document.getElementById('c')
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true })
renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
renderer.setSize(innerWidth, innerHeight)
renderer.shadowMap.enabled = true
renderer.shadowMap.type    = THREE.PCFSoftShadowMap
renderer.autoClear         = false

const scene = new THREE.Scene()
scene.background = new THREE.Color(0x87ceeb)
scene.fog        = new THREE.Fog(0x87ceeb, 70, 220)

scene.add(new THREE.AmbientLight(0xffffff, 0.5))
const sun = new THREE.DirectionalLight(0xffffff, 0.95)
sun.position.set(18, 40, 12)
sun.castShadow = true
Object.assign(sun.shadow.camera, { near:0.5, far:150, left:-28, right:28, top:22, bottom:-22 })
sun.shadow.mapSize.set(1024, 1024)
scene.add(sun)

const clock = new THREE.Clock()

// ═══════════════════════════════════════════════════════════════
//  ENVIRONMENT
// ═══════════════════════════════════════════════════════════════

// Ground (grass)
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(300, 300),
  new THREE.MeshStandardMaterial({ color: 0x4d7c32, roughness: 1 })
)
ground.rotation.x = -PI / 2
ground.receiveShadow = true
scene.add(ground)

// Exam mat centered on the 15m x 15m field
const mat = new THREE.Mesh(
  new THREE.PlaneGeometry(18, 18),
  new THREE.MeshStandardMaterial({ color: 0x8a8a8a, roughness: 0.85 })
)
mat.rotation.x = -PI / 2
mat.position.set(0, 0.005, FIELD_CENTER_Z)
mat.receiveShadow = true
scene.add(mat)

// Helper: thin flat ring / circle outline on ground
function groundRing(rx, rz, color, y = 0.01) {
  const segs = 64
  const pts = []
  for (let i = 0; i <= segs; i++) {
    const a = (i / segs) * PI * 2
    pts.push(new THREE.Vector3(Math.sin(a) * rx, 0, Math.cos(a) * rz))
  }
  const geom = new THREE.BufferGeometry().setFromPoints(pts)
  const line = new THREE.Line(geom, new THREE.LineBasicMaterial({ color }))
  line.position.y = y
  scene.add(line)
  return line
}

// Helper: draw a rectangle outline on ground
function groundRect(cx, cz, w, d, color, y = 0.013) {
  const hw = w / 2, hd = d / 2
  const pts = [
    new THREE.Vector3(cx - hw, 0, cz - hd),
    new THREE.Vector3(cx + hw, 0, cz - hd),
    new THREE.Vector3(cx + hw, 0, cz + hd),
    new THREE.Vector3(cx - hw, 0, cz + hd),
    new THREE.Vector3(cx - hw, 0, cz - hd),
  ]
  const geom = new THREE.BufferGeometry().setFromPoints(pts)
  const line = new THREE.Line(geom, new THREE.LineBasicMaterial({ color }))
  line.position.y = y
  scene.add(line)
}

function groundFillRect(cx, cz, w, d, color, y = 0.011) {
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(w, d),
    new THREE.MeshStandardMaterial({ color, roughness: 0.8 })
  )
  m.rotation.x = -PI / 2
  m.position.set(cx, y, cz)
  scene.add(m)
  return m
}

// 15m x 15m field boundary from 圖 9
groundRect(0, FIELD_CENTER_Z, FIELD_W, FIELD_W, 0xffffff, 0.014)

// Flight rectangle (12m × 5m), centered at (0, 0, -2.5)
groundRect(0, -REC_D / 2, REC_W, REC_D, 0xffffff, 0.014)

// H pad – white filled disc
const hPad = new THREE.Mesh(
  new THREE.CircleGeometry(0.75, 48),
  new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 })
)
hPad.rotation.x = -PI / 2
hPad.position.set(0, 0.015, 0)
scene.add(hPad)

// H pad inner ring
groundRing(0.75, 0.75, 0x333333, 0.017)

// Dashed center line from H toward north (−Z) through rectangle
function dashedLine(x, z0, z1, color, y = 0.012) {
  const segs = 20
  const step = (z1 - z0) / segs
  for (let i = 0; i < segs; i += 2) {
    const pts = [
      new THREE.Vector3(x, 0, z0 + i * step),
      new THREE.Vector3(x, 0, z0 + (i + 1) * step),
    ]
    const geom = new THREE.BufferGeometry().setFromPoints(pts)
    scene.add(new THREE.Line(geom, new THREE.LineBasicMaterial({ color })))
  }
}
dashedLine(0, 0, -REC_D, 0xcccccc, 0.014)

// Helper: small circle marker at corner
function cornerMarker(x, z, color = 0xffffff) {
  const m = new THREE.Mesh(
    new THREE.CircleGeometry(0.28, 24),
    new THREE.MeshStandardMaterial({ color, roughness: 0.5 })
  )
  m.rotation.x = -PI / 2
  m.position.set(x, 0.016, z)
  scene.add(m)
}

// P1–P4 corner markers (white)
cornerMarker(-HW,  0)        // P1 front-left
cornerMarker(-HW, -REC_D)    // P2 back-left
cornerMarker( HW, -REC_D)    // P3 back-right
cornerMarker( HW,  0)        // P4 front-right

// Safety cone helper
function cone(x, z) {
  const g = new THREE.Group()
  const body = new THREE.Mesh(
    new THREE.ConeGeometry(0.12, 0.45, 8),
    new THREE.MeshStandardMaterial({ color: 0xff6600 })
  )
  body.position.y = 0.225
  const base = new THREE.Mesh(
    new THREE.CylinderGeometry(0.16, 0.16, 0.04, 8),
    new THREE.MeshStandardMaterial({ color: 0x222222 })
  )
  base.position.y = 0.02
  g.add(body, base)
  g.position.set(x, 0, z)
  scene.add(g)
}

// Cones at 15m x 15m field corners from 圖 9
cone(-FIELD_HALF, FIELD_NORTH_Z); cone(FIELD_HALF, FIELD_NORTH_Z)
cone(-FIELD_HALF, FIELD_SOUTH_Z); cone(FIELD_HALF, FIELD_SOUTH_Z)
// Cones placed directly on rectangle hover points P1–P4
cone(-HW, 0)       // P1
cone(-HW, -REC_D)  // P2
cone(HW, -REC_D)   // P3
cone(HW, 0)        // P4

// A and B markers – large red circles (safety boundary refs)
function bigMarker(x, z, label) {
  const m = new THREE.Mesh(
    new THREE.CircleGeometry(0.55, 32),
    new THREE.MeshStandardMaterial({ color: 0xcc0000, roughness: 0.5 })
  )
  m.rotation.x = -PI / 2
  m.position.set(x, 0.016, z)
  scene.add(m)
}
bigMarker(-FIELD_HALF, FIELD_CENTER_Z)   // A
bigMarker( FIELD_HALF, FIELD_CENTER_Z)   // B

// P / h boxes and evaluator area from 圖 9
groundFillRect(0, 2.75, 1, 1, 0xffffff, 0.013) // P
groundFillRect(0, 3.75, 1, 1, 0xffffff, 0.013) // h
groundFillRect(0, 5.15, 3, 0.9, 0xffffff, 0.013) // 評鑑人員

// Operator standing mat
const opMat = new THREE.Mesh(
  new THREE.PlaneGeometry(1.2, 0.6),
  new THREE.MeshStandardMaterial({ color: 0x1565c0, roughness: 0.7 })
)
opMat.rotation.x = -PI / 2
opMat.position.set(0, 0.016, OP_Z)
scene.add(opMat)

// Operator figure
let operatorGroup = null
function makeOperator() {
  const g = new THREE.Group()
  const shirtMat = new THREE.MeshStandardMaterial({ color: 0xf57c00, roughness: 0.8 })
  const legMat  = new THREE.MeshStandardMaterial({ color: 0x263238, roughness: 0.9 })
  const headMat = new THREE.MeshStandardMaterial({ color: 0xf5cba7 })
  const vestMat = new THREE.MeshStandardMaterial({ color: 0xff3d00, roughness: 0.7 })
  const capMat = new THREE.MeshStandardMaterial({ color: 0x37474f, roughness: 0.85 })
  const radioMat = new THREE.MeshStandardMaterial({ color: 0x212121, roughness: 0.75 })

  // legs
  ;[[-0.08, -0.08], [0.08, 0.08]].forEach(([x, rz]) => {
    const leg = new THREE.Mesh(
      new THREE.CylinderGeometry(0.045, 0.05, 0.72, 8),
      legMat
    )
    leg.position.set(x, 0.36, 0)
    leg.rotation.z = rz
    g.add(leg)
  })

  // shoes
  ;[[-0.09], [0.09]].forEach(([x]) => {
    const shoe = new THREE.Mesh(
      new THREE.BoxGeometry(0.12, 0.05, 0.22),
      new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 })
    )
    shoe.position.set(x, 0.04, 0.06)
    g.add(shoe)
  })

  // torso and vest
  const torso = new THREE.Mesh(
    new THREE.CylinderGeometry(0.13, 0.16, 0.46, 10),
    shirtMat
  )
  torso.position.y = 1.02
  g.add(torso)

  const vest = new THREE.Mesh(
    new THREE.BoxGeometry(0.24, 0.34, 0.18),
    vestMat
  )
  vest.position.set(0, 1.03, 0.05)
  g.add(vest)

  // arms holding controller
  ;[[-0.22, 0.48], [0.22, -0.48]].forEach(([x, rz]) => {
    const arm = new THREE.Mesh(
      new THREE.CylinderGeometry(0.03, 0.035, 0.42, 8),
      shirtMat
    )
    arm.position.set(x, 0.96, 0.12)
    arm.rotation.z = rz
    arm.rotation.x = PI / 2.8
    g.add(arm)
  })

  // head
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 12), headMat)
  head.position.y = 1.5
  g.add(head)

  const cap = new THREE.Mesh(
    new THREE.CylinderGeometry(0.125, 0.125, 0.08, 12),
    capMat
  )
  cap.position.y = 1.6
  g.add(cap)

  const brim = new THREE.Mesh(
    new THREE.BoxGeometry(0.14, 0.015, 0.09),
    capMat
  )
  brim.position.set(0, 1.57, -0.1)
  g.add(brim)

  // RC transmitter box
  const rc = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.16, 0.08), radioMat)
  rc.position.set(0, 0.86, 0.24)
  g.add(rc)

  const antennaL = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.18, 6), radioMat)
  antennaL.position.set(-0.07, 1.02, 0.24)
  antennaL.rotation.x = 0.2

// ═══════════════════════════════════════════════════════════════
//  MATH HELPERS
// ═══════════════════════════════════════════════════════════════
function lerpAngle(a, b, t) {
  let d = b - a
  while (d >  PI) d -= PI * 2
  while (d < -PI) d += PI * 2
  let r = a + d * Math.min(t, 1)
  while (r >  PI) r -= PI * 2
  while (r < -PI) r += PI * 2
  return r
}

function v3(p) { return new THREE.Vector3(...p) }

function yawFromDir(dx, dz) {
  // Returns yaw such that nose points along (dx, 0, dz)
  return Math.atan2(dx, -dz)
}

// ═══════════════════════════════════════════════════════════════
//  DEMO AUTOPILOT
// ═══════════════════════════════════════════════════════════════
function updateDemo(dt) {
  if (!playing || wpIdx >= SEQ.length) return

  const wp  = SEQ[wpIdx]
  const nxt = SEQ[wpIdx + 1]

  if (wp.v === 0) {
    // ── HOVER / ROTATE entry ──────────────────────────────────
    // Lerp yaw toward target
    droneYaw = lerpAngle(droneYaw, wp.yaw, dt * 4.5)
    waitAccum += dt
    if (waitAccum >= (wp.d || 0)) {
      waitAccum = 0
      wpIdx++
    }
    // Inspector animation during A and F (CCW orbit)
    if (wp.s === 'A' || wp.s === 'F') {
      inspMesh.visible = true
      const orbitTurns = Math.min(waitAccum / Math.max(wp.d || 1, 1), 1)
      inspAngle = orbitTurns * PI * 2
      inspMesh.position.set(
        dronePos.x + Math.sin(inspAngle) * 1.15,
        0,
        dronePos.z + Math.cos(inspAngle) * 1.15
      )
      inspMesh.rotation.y = inspAngle + PI
    } else {
      inspMesh.visible = false
    }
  } else {
    // ── TRANSIT entry ─────────────────────────────────────────
    if (!nxt) { wpIdx++; return }
    const startP = v3(wp.p)
    const endP   = v3(nxt.p)
    const seg    = new THREE.Vector3().subVectors(endP, startP)
    const segLen = seg.length()

    if (segLen < 0.001) { wpIdx++; return }

    // Auto-compute yaw from horizontal direction; fall back to wp.yaw for vertical moves
    const horizMag = Math.sqrt(seg.x * seg.x + seg.z * seg.z)
    const targetYaw = horizMag > 0.05 ? yawFromDir(seg.x, seg.z) : (wp.yaw ?? droneYaw)
    const yawLerp = wp.s === 'Cb' ? 1.4 : 5

    if (wp.s === 'Cb' && horizMag > 0.05 && wpProg === 0) {
      let yawErr = targetYaw - droneYaw
      while (yawErr > PI) yawErr -= PI * 2
      while (yawErr < -PI) yawErr += PI * 2
      droneYaw = lerpAngle(droneYaw, targetYaw, dt * yawLerp)
      if (Math.abs(yawErr) > 0.08) {
        dronePos.copy(startP)
        inspMesh.visible = false
        return
      }
    }

    const speed = wp.v
    wpProg += (speed * dt) / segLen
    if (wpProg >= 1) { wpProg = 0; wpIdx++; return }

    dronePos.lerpVectors(startP, endP, wpProg)
    droneYaw = lerpAngle(droneYaw, targetYaw, dt * yawLerp)

    inspMesh.visible = false
  }
}

  let yawInput = 0
  if (keys['KeyQ'])      yawInput -= 1   // CCW
  if (keys['KeyE'])      yawInput += 1   // CW
  yawInput += sticks.L.x
  yawInput = Math.max(-1, Math.min(1, yawInput))
  droneYaw = lerpAngle(droneYaw, droneYaw + yawInput * MAN.yawSpd * dt, 1)

  // --- Throttle (left stick Y / Space, Shift) ---
  let throttle = 0
  if (keys['Space'])      throttle += 1
  if (keys['ShiftLeft'] || keys['ShiftRight']) throttle -= 1
  throttle -= sticks.L.y   // push up = negative Y on stick
  throttle  = Math.max(-1, Math.min(1, throttle))
  dronePos.y += throttle * MAN.throttle * dt
  dronePos.y  = Math.max(0, Math.min(25, dronePos.y))

  // --- Forward/back (right stick Y / W,S) ---
  let fwd = 0
  if (keys['KeyW'] || keys['ArrowUp'])   fwd += 1
  if (keys['KeyS'] || keys['ArrowDown']) fwd -= 1
  fwd -= sticks.R.y
  fwd = Math.max(-1, Math.min(1, fwd))

  // --- Strafe (right stick X / A,D) ---
  let strafe = 0
  if (keys['KeyD'] || keys['ArrowRight']) strafe += 1
  if (keys['KeyA'] || keys['ArrowLeft'])  strafe -= 1
  strafe += sticks.R.x
  strafe = Math.max(-1, Math.min(1, strafe))

  // Move in drone-heading frame
  const sinY = Math.sin(droneYaw), cosY = Math.cos(droneYaw)
  dronePos.x += (fwd * sinY + strafe * cosY) * MAN.moveSpd * dt
  dronePos.z += (fwd * (-cosY) + strafe * sinY) * MAN.moveSpd * dt
}

// ═══════════════════════════════════════════════════════════════
//  MULTI-VIEWPORT RENDER
// ═══════════════════════════════════════════════════════════════
const PIP_SZ = Math.round(Math.min(W, H) * 0.24)
const MARGIN  = 10

function setViewport(x, y, w, h, cam) {
  renderer.setViewport(x, y, w, h)
  renderer.setScissor(x, y, w, h)
  renderer.setScissorTest(true)
  cam.aspect = w / h
  if (cam.isOrthographicCamera) {
    const aspect = w / h
    cam.left   = -TOP_HALF * aspect
    cam.right  =  TOP_HALF * aspect
    cam.top    =  TOP_HALF
    cam.bottom = -TOP_HALF
  }
  cam.updateProjectionMatrix()
  const hideOperator = cam === opCam
  if (hideOperator) {
    opMat.visible = false
    if (operatorGroup) operatorGroup.visible = false
  }
  renderer.render(scene, cam)
  if (hideOperator) {
    opMat.visible = true
    if (operatorGroup) operatorGroup.visible = true
  }
}

function renderAll() {
  renderer.clear()

  if (mainCam === 'all') {
    // Three-way split: op (left), top (top-right), fpv (bottom-right)
    const hw = Math.floor(W / 2)
    const hh = Math.floor(H / 2)
    setViewport(0,   0,  hw,  H,  opCam)
    setViewport(hw,  hh, W - hw, H - hh, topCam)
    setViewport(hw,  0,  W - hw, hh,     fpvCam)
  } else {
    // Main view fills entire canvas
    setViewport(0, 0, W, H, activeCam())

    // PiP pair — top-right, side-by-side
    const pipY = H - MARGIN - PIP_SZ
    const pip2x = W - MARGIN - PIP_SZ
    const pip1x = pip2x - PIP_SZ - MARGIN
    setViewport(pip1x, pipY, PIP_SZ, PIP_SZ, topCam)

    const secCam = mainCam === 'fpv' ? opCam : fpvCam
    setViewport(pip2x, pipY, PIP_SZ, PIP_SZ, secCam)
  }
}

function activeCam() {
  if (mainCam === 'op')  return opCam
  if (mainCam === 'fpv') return fpvCam
  if (mainCam === 'top') return topCam
  return opCam
}

function layoutPip() {
  const pf1 = document.getElementById('pf1')
  const pf2 = document.getElementById('pf2')
  const pl1 = document.getElementById('pl1')
  const pl2 = document.getElementById('pl2')
  const pipTop = MARGIN
  const pip2Right = MARGIN
  const pip1Right = MARGIN + PIP_SZ + MARGIN
  const showPip = mainCam !== 'all'

  if (showPip) {
    Object.assign(pf1.style, {
      display:'block', right: pip1Right+'px', top: pipTop+'px',
      width: PIP_SZ+'px', height: PIP_SZ+'px'
    })
    Object.assign(pf2.style, {
      display:'block', right: pip2Right+'px', top: pipTop+'px',
      width: PIP_SZ+'px', height: PIP_SZ+'px'
    })
    pl1.style.cssText = `display:block;right:${pip1Right+4}px;top:${pipTop + 3}px`
    pl1.textContent = '🗺 俯視'
    pl2.style.cssText = `display:block;right:${pip2Right+4}px;top:${pipTop + 3}px`
    pl2.textContent = mainCam === 'fpv' ? '👁 操作者' : '🎥 FPV'
  } else {
    pf1.style.display = 'none'; pf2.style.display = 'none'
    pl1.style.display = 'none'; pl2.style.display = 'none'
  }

  // Split labels
  const all = mainCam === 'all'
  document.getElementById('sl-op').style.cssText =
    all ? 'display:block;left:8px;bottom:8px' : 'display:none'
  document.getElementById('sl-top').style.cssText =
    all ? `display:block;left:${Math.floor(W/2)+8}px;top:8px` : 'display:none'
  document.getElementById('sl-fpv').style.cssText =
    all ? `display:block;left:${Math.floor(W/2)+8}px;bottom:8px` : 'display:none'

  // FPV crosshair
  const fpvhud = document.getElementById('fpvhud')
  fpvhud.style.display = (mainCam === 'fpv') ? 'block' : 'none'
}

// ═══════════════════════════════════════════════════════════════
//  ANIMATION LOOP
// ═══════════════════════════════════════════════════════════════
let propSpin = 0

function animate() {
  requestAnimationFrame(animate)
  const dt = Math.min(clock.getDelta(), 0.1)

  // Update drone state
  prevPos.copy(dronePos)
  if (mode === 'demo')   updateDemo(dt)
  else                   updateManual(dt)

  // Sync dronePos from SEQ hover entries
  if (mode === 'demo') {
    const wp = SEQ[Math.min(wpIdx, SEQ.length - 1)]
    if (wp && wp.v === 0) dronePos.copy(v3(wp.p))
  }

  // Apply to drone mesh
  droneGroup.position.copy(dronePos)
  droneGroup.rotation.y = -droneYaw

  // Spin propellers
  propSpin += dt * 25
  propGroups.forEach((pg, i) => {
    pg.rotation.y = propSpin * (i % 2 === 0 ? 1 : -1)
  })

  // Update FPV camera to follow drone nose
  const fwdVec = new THREE.Vector3(Math.sin(droneYaw), 0, -Math.cos(droneYaw))
  fpvMount.getWorldPosition(fpvCam.position)
  fpvCam.lookAt(fpvCam.position.clone().add(fwdVec))

  // Operator camera gently tracks drone
  opCam.position.set(0, opEyeHeight, OP_Z)
  const lookTarget = new THREE.Vector3(dronePos.x * 0.4, Math.max(dronePos.y, 0.5), dronePos.z * 0.3)
  opCam.lookAt(lookTarget)

  // Top camera follows drone XZ
  topCam.position.set(dronePos.x, 50, dronePos.z)
  topCam.lookAt(dronePos.x, 0, dronePos.z)

  // Update status HUD
  const velX = (dronePos.x - prevPos.x) / Math.max(dt, 0.001)
  const velY = (dronePos.y - prevPos.y) / Math.max(dt, 0.001)
  const velZ = (dronePos.z - prevPos.z) / Math.max(dt, 0.001)
  const speed = Math.sqrt(velX*velX + velY*velY + velZ*velZ)
  document.getElementById('sAlt').textContent = dronePos.y.toFixed(1)
  document.getElementById('sSpd').textContent = speed.toFixed(1)
  let hdgDeg = Math.round(((droneYaw / PI) * 180 + 360) % 360)
  document.getElementById('sHdg').textContent = hdgDeg

  // Update callout from demo SEQ
  if (mode === 'demo' && wpIdx < SEQ.length) updateCallout()

  renderAll()
}

// ═══════════════════════════════════════════════════════════════
//  UI HELPERS
// ═══════════════════════════════════════════════════════════════
function updateCallout() {
  const wp = SEQ[wpIdx] || SEQ[SEQ.length - 1]
  const el = document.getElementById('callout')
  el.textContent = wp.t || ''
  el.classList.toggle('hi', !!wp.hi)

  const cd = document.getElementById('countdown')
  const showCountdown = mode === 'demo' && wp.v === 0 && (wp.t || '').includes('3、2、1、Go')
  const showHoverCountdown = mode === 'demo' && wp.v === 0 && (wp.t || '').includes('懸停 5 秒')
  if (showCountdown) {
    const total = Math.max(wp.d || 0, 0.1)
    const phase = Math.min(3, Math.floor((waitAccum / total) * 4))
    const label = ['3', '2', '1', 'Go'][phase]
    cd.textContent = label
    cd.style.display = 'block'
    cd.classList.toggle('go', label === 'Go')
  } else if (showHoverCountdown) {
    const elapsed = Math.min(waitAccum, 5)
    cd.textContent = Math.min(5, Math.max(1, Math.ceil(elapsed))).toString()
    cd.style.display = 'block'
    cd.classList.remove('go')
  } else {
    cd.style.display = 'none'
    cd.classList.remove('go')
  }

  updateStepPanel()
}

function buildStepPanel() {
  const steps = document.getElementById('steps')
  STEP_DEFS.forEach(def => {
    const div = document.createElement('div')
    div.className = 'si'
    div.id = 'si-' + def.id
    div.onclick = () => jumpToStep(def.id)
    div.innerHTML = `<div class="sid">${def.icon}</div><span>${def.label}</span>`
    steps.appendChild(div)
  })
}

function updateStepPanel() {
  const cur = wpIdx < SEQ.length ? SEQ[wpIdx].s : null
  STEP_DEFS.forEach(def => {
    const el = document.getElementById('si-' + def.id)
    if (el) el.classList.toggle('on', def.id === cur)
  })
}

function jumpToStep(stepId) {
  const idx = SEQ.findIndex(w => w.s === stepId)
  if (idx < 0) return
  wpIdx = idx
  wpProg = 0
  waitAccum = 0
  dronePos.copy(v3(SEQ[idx].p))
  droneYaw = SEQ[idx].yaw ?? 0
  updateCallout()
  updateStepPanel()
}

function togglePlay() {
  playing = !playing
  document.getElementById('bPlay').textContent = playing ? '⏸ 暫停' : '▶ 繼續'
}

function stepNav(dir) {
  // Find index in STEP_DEFS
  const cur = wpIdx < SEQ.length ? SEQ[wpIdx].s : STEP_DEFS[0].id
  const si  = STEP_DEFS.findIndex(d => d.id === cur)
  const ni  = Math.max(0, Math.min(STEP_DEFS.length - 1, si + dir))
  jumpToStep(STEP_DEFS[ni].id)
}

function setMainCam(cam) {
  mainCam = cam
  document.querySelectorAll('.cb').forEach(b => b.classList.remove('on'))
  const btn = document.getElementById('cam-' + cam)
  if (btn) btn.classList.add('on')
  layoutPip()
}

function syncOpEyeUI() {
  document.getElementById('opEye').value = opEyeHeight.toFixed(2)
  document.getElementById('opEyeVal').textContent = opEyeHeight.toFixed(2)
}

function toggleMode() {
  mode = mode === 'demo' ? 'manual' : 'demo'
  const btn = document.getElementById('modebtn')
  if (mode === 'manual') {
    btn.textContent = '🕹 手動模式'
    btn.classList.add('manual')
    document.getElementById('ply').style.display = 'none'
    document.getElementById('sMode').textContent = '手動'
    document.getElementById('zoneL').style.display = 'block'
    document.getElementById('zoneR').style.display = 'block'
    initJoysticks()
    document.getElementById('callout').textContent = '🕹 手動模式：自由練習飛行'
    document.getElementById('callout').classList.remove('hi')
    // In manual mode: hide steps & HUD, let user decide
    setStepsPanelVisible(false)
    setHudVisible(false)
  } else {
    btn.textContent = '🎬 示範模式'
    btn.classList.remove('manual')
    document.getElementById('ply').style.display = 'flex'
    document.getElementById('sMode').textContent = '示範'
    document.getElementById('zoneL').style.display = 'none'
    document.getElementById('zoneR').style.display = 'none'
    jumpToStep(SEQ[wpIdx]?.s || 'A')
    // In demo mode: auto-collapse all panels, show steps for navigation
    setHudVisible(false)
    setStepsPanelVisible(true)
  }
}

// ═══════════════════════════════════════════════════════════════
//  WINDOW RESIZE
// ═══════════════════════════════════════════════════════════════
window.addEventListener('resize', () => {
  const nw = innerWidth, nh = innerHeight
  renderer.setSize(nw, nh)
  opCam.aspect = nw / nh
  opCam.updateProjectionMatrix()
  fpvCam.aspect = nw / nh
  fpvCam.updateProjectionMatrix()
  layoutPip()
})

// ═══════════════════════════════════════════════════════════════
//  MOBILE LAYOUT HELPERS
// ═══════════════════════════════════════════════════════════════
let stepsVisible = true
let hudVisible   = false

function setStepsPanelVisible(visible) {
  stepsVisible = visible
  const stepsEl = document.getElementById('steps')
  const btn     = document.getElementById('steps-toggle')

  if (visible) {
    stepsEl.style.display = 'block'
    btn.textContent = '✕'
    btn.style.borderColor = 'rgba(255,255,255,.6)'
  } else {
    stepsEl.style.display = 'none'
    btn.textContent = '📋'
    btn.style.borderColor = 'rgba(255,255,255,.3)'
  }
}

function toggleSteps() {
  setStepsPanelVisible(!stepsVisible)
}

function setHudVisible(visible) {
  hudVisible = visible
  const rpEl = document.getElementById('right-panels')
  const btn  = document.getElementById('hud-toggle')
  if (visible) {
    rpEl.style.display = 'flex'
    btn.textContent = '✕'
    btn.style.borderColor = 'rgba(255,255,255,.6)'
    // Show/hide keyhint depending on current mode
    document.getElementById('keyhint').style.display = mode === 'manual' ? 'block' : 'none'
  } else {
    rpEl.style.display = 'none'
    btn.textContent = '📊'
    btn.style.borderColor = 'rgba(255,255,255,.3)'
  }
}

function toggleHud() {
  setHudVisible(!hudVisible)
}

function initMobileLayout() {
  // Demo mode: show steps panel, hide HUD
  // Manual mode: hide both, let user decide
  setStepsPanelVisible(mode === 'demo')
  setHudVisible(false)
}

window.addEventListener('resize', () => {
  // Re-apply current state on orientation change
  setStepsPanelVisible(stepsVisible)
  setHudVisible(hudVisible)
})

// ═══════════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════════
buildStepPanel()
jumpToStep('A')
// Boot in demo mode — play bar visible, joysticks hidden
document.getElementById('modebtn').textContent = '🎬 示範模式'
document.getElementById('ply').style.display = 'flex'
document.getElementById('sMode').textContent = '示範'
document.getElementById('zoneL').style.display = 'none'
document.getElementById('zoneR').style.display = 'none'
document.getElementById('opEye').addEventListener('input', e => {
  opEyeHeight = Number(e.target.value)
  syncOpEyeUI()
})
syncOpEyeUI()
initMobileLayout()
initJoysticks()
layoutPip()
animate()
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>術科測驗模擬器 — 無人飛機基本級未達 2 公斤</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box }
body { overflow:hidden; background:#0a0a1a; font-family:'Segoe UI',system-ui,sans-serif; color:#fff; touch-action:none }
#c { position:absolute; top:0; left:0; display:block }

#callout {
  position:absolute; top:14px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,.85); border:2px solid #4caf50;
  padding:10px 24px; border-radius:9px;
  font-size:1.15rem; font-weight:600;
  max-width:60vw; text-align:center; z-index:30;
  pointer-events:none; transition:opacity .3s, border-color .3s, color .3s;
}
#callout.hi { border-color:#ffc107; color:#ffd54f }

#steps { position:absolute; left:8px; top:8px; width:200px; background:rgba(0,0,0,.8); border-radius:10px; overflow:hidden; z-index:20 }
#shdr  { background:#1565c0; padding:9px 14px; font-weight:700; font-size:.88rem }
.si {
  display:flex; align-items:center; gap:9px;
  padding:7px 12px; cursor:pointer; font-size:.78rem;
  border-bottom:1px solid rgba(255,255,255,.07); transition:background .15s;
}
.si:hover { background:rgba(255,255,255,.1) }
.si.on  { background:rgba(76,175,80,.22); color:#a5d6a7 }
.sid {
  width:25px; height:25px; border-radius:50%; flex-shrink:0;
  background:rgba(255,255,255,.13); display:flex;
  align-items:center; justify-content:center; font-size:.68rem; font-weight:700;
}
.si.on .sid { background:#4caf50; color:#fff }

#cams { position:absolute; bottom:14px; left:50%; transform:translateX(-50%); display:flex; gap:7px; z-index:20 }
.cb {
  padding:6px 15px; background:rgba(0,0,0,.72);
  border:1px solid rgba(255,255,255,.28); border-radius:18px;
  cursor:pointer; font-size:.78rem; color:#bbb; transition:all .2s; white-space:nowrap;
}
.cb.on { background:#1565c0; color:#fff; border-color:#42a5f5 }
.cb:hover:not(.on) { background:rgba(255,255,255,.14); color:#fff }

#ply { position:absolute; bottom:52px; left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:20 }
.pb {
  padding:6px 14px; background:rgba(0,0,0,.72);
  border:1px solid rgba(255,255,255,.22); border-radius:7px;
  cursor:pointer; font-size:.82rem; color:#fff;
}
.pb:hover { background:rgba(255,255,255,.18) }
.pb.pri { background:rgba(21,101,192,.85); border-color:#42a5f5 }

#stat {
  position:absolute; right:8px; bottom:100px;
  background:rgba(0,0,0,.72); padding:8px 12px;
  border-radius:8px; font-size:.72rem; z-index:20;
  pointer-events:none; line-height:1.8;
}
#stat b { color:#4fc3f7 }

#meas {
  position:absolute; left:216px; top:8px;
  background:rgba(0,0,0,.64); padding:6px 12px;
  border-radius:7px; font-size:.68rem; color:#aaa; z-index:20; pointer-events:none;
}

.pf { position:absolute; border:1.5px solid rgba(255,255,255,.35); border-radius:4px; z-index:19; pointer-events:none }
.pl { position:absolute; font-size:.62rem; color:rgba(255,255,255,.85); background:rgba(0,0,0,.62); padding:2px 5px; border-radius:2px; z-index:21; pointer-events:none }

.slbl {
  position:absolute; font-size:.66rem; color:rgba(255,255,255,.7);
  background:rgba(0,0,0,.52); padding:3px 7px; border-radius:3px;
  z-index:22; pointer-events:none; display:none;
}

#fpvhud { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:22; display:none }

/* Portrait orientation warning */
#orient-warn{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);
  color:#fff;z-index:9999;justify-content:center;align-items:center;
  text-align:center;font-size:1.15rem;padding:24px;line-height:1.8}
@media screen and (orientation:portrait){#orient-warn{display:flex}}
</style>
</head>
<body>
<div id="orient-warn">🔄 請將裝置旋轉為橫向<br>以獲得最佳體驗</div>
<canvas id="c"></canvas>

<div id="callout">準備中…</div>

<div id="steps"><div id="shdr">📋 術科測驗流程</div></div>

<div id="meas">📏 A↔B ≥ 100 公尺 ｜ 飛行高度 ≥ 50 公尺 ｜ 跑道寬 4 公尺 ｜ 降落半徑 50 公尺</div>

<div id="stat">
  高度：<b id="sAlt">0.0</b> m<br>
  速度：<b id="sSpd">0</b> m/s<br>
  航向：<b id="sHdg">090</b>°
</div>

<div id="ply">
  <button class="pb" onclick="stepNav(-1)">◀ 上一步</button>
  <button class="pb pri" id="bPlay" onclick="togglePlay()">⏸ 暫停</button>
  <button class="pb" onclick="stepNav(1)">下一步 ▶</button>
</div>

<div id="cams">
  <button class="cb on"  id="cam-op"  onclick="setMainCam('op')">👁 操作者視角</button>
  <button class="cb"     id="cam-fpv" onclick="setMainCam('fpv')">🎥 無人機視角</button>
  <button class="cb"     id="cam-top" onclick="setMainCam('top')">🗺 上視圖</button>
  <button class="cb"     id="cam-all" onclick="setMainCam('all')">⊞ 三視圖</button>
</div>

<!-- PiP CSS frames & labels -->
<div class="pf" id="pf1"></div><div class="pf" id="pf2"></div>
<div class="pl" id="pl1"></div><div class="pl" id="pl2"></div>

<!-- Split-mode labels -->
<div class="slbl" id="sl-op">👁 操作者視角</div>
<div class="slbl" id="sl-top">🗺 上視圖</div>
<div class="slbl" id="sl-fpv">🎥 無人機視角</div>

<!-- FPV crosshair HUD -->
<div id="fpvhud">
  <svg width="64" height="64" viewBox="0 0 64 64">
    <line x1="32" y1="4"  x2="32" y2="22" stroke="rgba(255,255,255,.55)" stroke-width="1.5"/>
    <line x1="32" y1="42" x2="32" y2="60" stroke="rgba(255,255,255,.55)" stroke-width="1.5"/>
    <line x1="4"  y1="32" x2="22" y2="32" stroke="rgba(255,255,255,.55)" stroke-width="1.5"/>
    <line x1="42" y1="32" x2="60" y2="32" stroke="rgba(255,255,255,.55)" stroke-width="1.5"/>
    <circle cx="32" cy="32" r="5" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.5"/>
  </svg>
</div>

<script>
'use strict';
// ═══════════════════════════════════════════════════════════════
//  WORLD CONSTANTS  (1 unit = 1 metre)
// ═══════════════════════════════════════════════════════════════
const RW_LEN   = 300;   // runway length
const RW_W     = 4;     // runway width (exam spec)
const CRUISE   = 50;    // mission altitude (≥50 m per spec)
const WP_Z     = -90;   // race-track north of runway (Z axis, negative = north)
const WP_AX    = -70;   // waypoint A  x-position
const WP_BX    =  70;   // waypoint B  x-position  →  A↔B = 140 m ≥ 100 m ✓
const RT_R     =  18;   // race-track turn radius
const OP_Z     =  25;   // operator stands 25 m south of runway

// ═══════════════════════════════════════════════════════════════
//  DEMO SEQUENCE
//  Each entry: { s:stepId, p:[x,y,z], v:speed(m/s),
//                t:calloutText, d:calloutDuration(s), hi:highlight }
//  v=0  → drone stationary; wait d seconds then advance
//  v>0  → fly toward next waypoint at v m/s
// ═══════════════════════════════════════════════════════════════
const SEQ = [
  // ── A: 飛行前檢查 ──────────────────────────────────────────
  { s:'A', p:[-100,0.3,0], v:0, t:'【A. 飛行前檢查】確認系統知識：載具型式、最大起飛重量、酬載、螺旋槳規格、電池規格…', d:5 },
  { s:'A', p:[-100,0.3,0], v:0, t:'確認遙控器各搖桿及開關功能是否正常 ✓', d:3.5 },
  { s:'A', p:[-100,0.3,0], v:0, t:'以逆時針方向 ↺ 繞機實施飛行前 360° 檢查', d:5.5 },

  // ── B: 設定飛行任務 ────────────────────────────────────────
  { s:'B', p:[-100,0.3,0], v:0, t:'【B. 設定飛行任務】\n「3、2、1、Go」', d:2.5, hi:1 },
  { s:'B', p:[-100,0.3,0], v:0, t:'設定導航點 A ── 位置、高度 50 m、速度', d:3.5 },
  { s:'B', p:[-100,0.3,0], v:0, t:'設定導航點 B ── 位置、高度 50 m（A↔B = 140 m  ≥ 100 m ✓）', d:3.5 },
  { s:'B', p:[-100,0.3,0], v:0, t:'設定歸航點 ── 位置、高度、速度', d:3 },
  { s:'B', p:[-100,0.3,0], v:0, t:'確認控制信號鏈路暢通，任務指令上傳完成', d:3 },
  { s:'B', p:[-100,0.3,0], v:0, t:'「結束」', d:2.5, hi:1 },

  // ── C-a: 執行起飛（滑行起飛）──────────────────────────────
  { s:'Ca', p:[-100,0.3,0],  v:0,  t:'【C-a. 執行起飛（滑行起飛）】\n「3、2、1、Go」', d:2, hi:1 },
  { s:'Ca', p:[-55, 0.4,0],  v:22 },
  { s:'Ca', p:[-10, 9,  0],  v:28 },
  { s:'Ca', p:[ 55,30,  0],  v:32 },
  { s:'Ca', p:[115,50,  0],  v:32 },
  { s:'Ca', p:[135,50,-22],  v:30, t:'橫風邊（第二邊）', d:1.5 },
  { s:'Ca', p:[135,50,-65],  v:30 },
  { s:'Ca', p:[ 60,50,-65],  v:30, t:'順風邊（第三邊）', d:1.5 },
  { s:'Ca', p:[-70,50,-65],  v:30 },
  { s:'Ca', p:[-120,50,-65], v:30, t:'「結束」── 維持五邊航線，待命任務飛行', d:3.5, hi:1 },

  // ── C-b: 兩點任務飛行（Race-Track） ───────────────────────
  { s:'Cb', p:[-120,50,-65], v:0,  t:'【C-b. 任務飛行】\n「3、2、1、Go」── 切換任務模式', d:2.5, hi:1 },
  // leave pattern → approach race track near side
  { s:'Cb', p:[-70, 50,-72], v:32, t:'飛往導航點 A…', d:2 },
  // A left-arc entry: (-70,-72) → (-88,-90) → (-70,-108)
  { s:'Cb', p:[-88, 50,-90], v:28 },
  { s:'Cb', p:[-70, 50,-108],v:30 },
  // far straight: A → B  (≥100 m)
  { s:'Cb', p:[ 70, 50,-108],v:32, t:'A ➜ B（140 m  ≥ 100 m）✓', d:3 },
  // B right-arc: (70,-108) → (88,-90) → (70,-72)
  { s:'Cb', p:[ 88, 50,-90], v:28 },
  { s:'Cb', p:[ 70, 50,-72], v:30 },
  // near straight: B → A
  { s:'Cb', p:[-70, 50,-72], v:32, t:'B ➜ A 返回', d:2 },
  // back to pattern
  { s:'Cb', p:[-120,50,-65], v:30, t:'任務完成，返回五邊航線待命', d:2.5 },
  { s:'Cb', p:[-120,50,-65], v:0,  t:'「結束」── 任務飛行完成', d:3, hi:1 },

  // ── D: 結束飛行任務（降落）────────────────────────────────
  { s:'D', p:[-120,50,-65],  v:0,  t:'【D. 結束飛行任務】\n「3、2、1、Go」── 進入降落航線', d:2.5, hi:1 },
  { s:'D', p:[-150,50,-65],  v:26 },
  { s:'D', p:[-155,34,-32],  v:23, t:'底邊（第四邊）── 保持平穩，開始下降', d:2 },
  { s:'D', p:[-155,15, -3],  v:20 },
  { s:'D', p:[-132,11,  0],  v:20, t:'最後進場（第五邊）── 對準跑道中心線', d:2 },
  { s:'D', p:[ -85, 5,  0],  v:18 },
  { s:'D', p:[ -50, 1.6, 0], v:14, t:'輪式降落：維持等速飄降，降落點不超越中線', d:3 },
  { s:'D', p:[ -15, 0.3, 0], v:6  },
  { s:'D', p:[   5, 0.3, 0], v:0,  t:'安全落地 ──「結束」', d:3.5, hi:1 },

  // ── F: 飛行後檢查 ──────────────────────────────────────────
  { s:'F', p:[5, 0.3, 0], v:0, t:'【F. 飛行後檢查】\n以逆時針方向 ↺ 繞機實施飛行後 360° 檢查', d:6 },
  { s:'F', p:[5, 0.3, 0], v:0, t:'飛行後檢查完成 ✓　　測驗結束！', d:5, hi:1 },
];

const STEP_DEFS = [
  { id:'A',  lbl:'A.  飛行前檢查'     },
  { id:'B',  lbl:'B.  設定飛行任務'   },
  { id:'Ca', lbl:'C.  執行起飛'       },
  { id:'Cb', lbl:'C.  任務飛行'       },
  { id:'D',  lbl:'D.  結束飛行任務'   },
  { id:'F',  lbl:'F.  飛行後檢查'     },
];

// ═══════════════════════════════════════════════════════════════
//  THREE.JS CORE
// ═══════════════════════════════════════════════════════════════
const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
renderer.autoClear         = false;   // needed for multi-viewport rendering

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 250, 750);

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 0.92);
sun.position.set(100, 200, 70);
sun.castShadow = true;
sun.shadow.camera.near   = 1; sun.shadow.camera.far    = 900;
sun.shadow.camera.left   = -260; sun.shadow.camera.right  =  260;
sun.shadow.camera.top    =  260; sun.shadow.camera.bottom = -260;
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);

const clock = new THREE.Clock();

// ═══════════════════════════════════════════════════════════════
//  ENVIRONMENT
// ═══════════════════════════════════════════════════════════════

// Ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(1000, 1000),
  new THREE.MeshStandardMaterial({ color:0x4d7c32, roughness:1 })
);
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true;
scene.add(ground);

// Subtle grid (helps with depth perception)
const grid = new THREE.GridHelper(1000, 100, 0x000000, 0x000000);
grid.material.opacity = 0.07; grid.material.transparent = true;
grid.position.y = 0.01; scene.add(grid);

// ── Runway ──────────────────────────────────────────────────
const rwMat = new THREE.MeshStandardMaterial({ color:0x555555, roughness:0.95 });
const rw = new THREE.Mesh(new THREE.BoxGeometry(RW_LEN, 0.08, RW_W), rwMat);
rw.position.y = 0.04; rw.receiveShadow = true; scene.add(rw);

// Centreline dashes
const dMat = new THREE.MeshBasicMaterial({ color:0xffffff });
for (let x = -136; x <= 136; x += 14) {
  const d = new THREE.Mesh(new THREE.BoxGeometry(7, 0.01, 0.18), dMat);
  d.position.set(x, 0.09, 0); scene.add(d);
}
// Edge lines
[-RW_W/2, RW_W/2].forEach(z => {
  const e = new THREE.Mesh(new THREE.BoxGeometry(RW_LEN, 0.01, 0.13), dMat);
  e.position.set(0, 0.09, z); scene.add(e);
});
// Yellow start/threshold line
const slMat = new THREE.MeshBasicMaterial({ color:0xffdd00 });
const sl = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.01, RW_W+1), slMat);
sl.position.set(-100, 0.09, 0); scene.add(sl);

// ── Windsock ────────────────────────────────────────────────
(function addWindsock() {
  const poleMat = new THREE.MeshStandardMaterial({ color:0x888888, metalness:0.7 });
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,3.8,8), poleMat);
  pole.position.set(0, 1.9, -2.8); scene.add(pole);
  const sock = new THREE.Mesh(
    new THREE.ConeGeometry(0.3,1.8,8,1,true),
    new THREE.MeshStandardMaterial({ color:0xff3333, side:THREE.DoubleSide, transparent:true, opacity:0.88 })
  );
  sock.rotation.z = Math.PI/2; sock.position.set(0.95, 3.8, -2.8); scene.add(sock);
  const band = new THREE.Mesh(
    new THREE.CylinderGeometry(0.31,0.31,0.28,8,1,true),
    new THREE.MeshStandardMaterial({ color:0xffffff, side:THREE.DoubleSide })
  );
  band.rotation.z = Math.PI/2; band.position.set(0.18, 3.8, -2.8); scene.add(band);
})();

// ── Operator figure ──────────────────────────────────────────
(function addOperator() {
  const yMat = new THREE.MeshStandardMaterial({ color:0xffc107 });
  const bMat = new THREE.MeshStandardMaterial({ color:0x1565c0 });
  const sMat = new THREE.MeshStandardMaterial({ color:0xffaa88 });
  // Blue standing mat
  const standingMat = new THREE.Mesh(
    new THREE.BoxGeometry(1.1,0.04,0.75),
    new THREE.MeshStandardMaterial({ color:0x1a4fc8 })
  );
  standingMat.position.set(0, 0.02, OP_Z);
  scene.add(standingMat);
  const parts = [
    { geo:new THREE.CylinderGeometry(0.1,0.09,0.88,8), mat:bMat, pos:[-0.13,0.44,0] },
    { geo:new THREE.CylinderGeometry(0.1,0.09,0.88,8), mat:bMat, pos:[ 0.13,0.44,0] },
    { geo:new THREE.BoxGeometry(0.38,0.52,0.23),         mat:yMat, pos:[0,0.98,0]  },
    { geo:new THREE.SphereGeometry(0.17,8,6),            mat:sMat, pos:[0,1.47,0]  },
    { geo:new THREE.SphereGeometry(0.19,8,6),            mat: new THREE.MeshStandardMaterial({color:0xffdd00}), pos:[0,1.57,0], scy:0.62 },
    { geo:new THREE.BoxGeometry(0.18,0.12,0.04),         mat: new THREE.MeshStandardMaterial({color:0x222}),   pos:[0,0.9,-0.19] },
  ];
  parts.forEach(({ geo, mat, pos, scy }) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(pos[0], pos[1], pos[2] + OP_Z);
    if (scy) m.scale.y = scy;
    scene.add(m);
  });
})();

// ── Waypoint markers (ground cone + altitude beacon) ─────────
function addWaypoint(x, z, label) {
  const col  = label==='A' ? 0xff4444 : 0x4488ff;
  const mat  = new THREE.MeshStandardMaterial({ color:col, transparent:true, opacity:0.82 });
  const cone = new THREE.Mesh(new THREE.ConeGeometry(1.8,3.5,6), mat);
  cone.position.set(x, 1.75, z); scene.add(cone);
  const sphere = new THREE.Mesh(new THREE.SphereGeometry(3.2,16,8), mat);
  sphere.position.set(x, CRUISE, z); scene.add(sphere);
  const pts = [new THREE.Vector3(x,3.5,z), new THREE.Vector3(x,CRUISE,z)];
  scene.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color:col, transparent:true, opacity:0.45 })
  ));
}
addWaypoint(WP_AX, WP_Z, 'A');
addWaypoint(WP_BX, WP_Z, 'B');

// ── Race-track path (orange) ─────────────────────────────────
{
  const pts = [];
  const alt = CRUISE, az = WP_Z, r = RT_R;
  // Far straight  A → B  (z = az-r)
  for (let i=0; i<=24; i++) pts.push(new THREE.Vector3(WP_AX+(WP_BX-WP_AX)*i/24, alt, az-r));
  // Right arc around B: from (Bx, az-r) east to (Bx, az+r)
  for (let i=0; i<=20; i++) {
    const a = -Math.PI/2 + Math.PI*i/20;
    pts.push(new THREE.Vector3(WP_BX + r*Math.cos(a), alt, az + r*Math.sin(a)));
  }
  // Near straight  B → A  (z = az+r)
  for (let i=0; i<=24; i++) pts.push(new THREE.Vector3(WP_BX-(WP_BX-WP_AX)*i/24, alt, az+r));
  // Left arc around A: from (Ax, az+r) west to (Ax, az-r)
  for (let i=0; i<=20; i++) {
    const a = Math.PI/2 + Math.PI*i/20;
    pts.push(new THREE.Vector3(WP_AX + r*Math.cos(a), alt, az + r*Math.sin(a)));
  }
  pts.push(pts[0]);
  scene.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color:0xff8800 })
  ));
}

// ── Traffic-pattern path (cyan) ──────────────────────────────
{
  const pts = [
    new THREE.Vector3(-100, 0.3, 0),
    new THREE.Vector3(115,  50,  0),
    new THREE.Vector3(135,  50, -22),
    new THREE.Vector3(135,  50, -65),
    new THREE.Vector3(-120, 50, -65),
    new THREE.Vector3(-155, 34, -32),
    new THREE.Vector3(-155, 11,   0),
    new THREE.Vector3( -80,  0.5, 0),
  ];
  scene.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color:0x44ccff, transparent:true, opacity:0.5 })
  ));
}

// ── Ground shadow (tracks drone) ────────────────────────────
const gShadow = new THREE.Mesh(
  new THREE.CircleGeometry(2, 32),
  new THREE.MeshBasicMaterial({ color:0x000000, transparent:true, opacity:0.28, depthWrite:false })
);
gShadow.rotation.x = -Math.PI/2; gShadow.position.y = 0.06;
scene.add(gShadow);

// ── Inspector indicator (360° check animation) ──────────────
const inspector = new THREE.Mesh(
  new THREE.SphereGeometry(0.45, 10, 8),
  new THREE.MeshStandardMaterial({ color:0xffd700 })
);
inspector.visible = false; scene.add(inspector);

// ═══════════════════════════════════════════════════════════════
//  FIXED-WING UAV MODEL  (nose points toward -Z when yaw=0)
// ═══════════════════════════════════════════════════════════════
const droneGroup = new THREE.Group();
const wMat  = new THREE.MeshStandardMaterial({ color:0xdddddd, roughness:0.25, metalness:0.1 });
const dkMat = new THREE.MeshStandardMaterial({ color:0x222222 });
const gnMat = new THREE.MeshStandardMaterial({ color:0x00c853 });

// Fuselage (long axis along Z; nose at -Z via rotation.x = π/2 on CylinderGeometry)
const fuse = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.07, 1.55, 10), wMat);
fuse.rotation.x = Math.PI/2; fuse.castShadow = true; droneGroup.add(fuse);

// Main wings (L + R, slight forward sweep)
[-1, 1].forEach(s => {
  const w = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.04, 0.37), wMat);
  w.position.set(s*0.63, 0.02, 0.06); w.rotation.y = s*0.08;
  w.castShadow = true; droneGroup.add(w);
});

// Horizontal stabiliser
const hs = new THREE.Mesh(new THREE.BoxGeometry(0.64, 0.03, 0.21), wMat);
hs.position.set(0, 0.01, 0.64); droneGroup.add(hs);

// Vertical stabiliser
const vs = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.3, 0.23), wMat);
vs.position.set(0, 0.15, 0.58); droneGroup.add(vs);

// Nose tip – green (= forward indicator)
const noseTip = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 6), gnMat);
noseTip.position.set(0, 0, -0.79); droneGroup.add(noseTip);

// Propeller group (spins around Z at nose)
const propGrp = new THREE.Group();
propGrp.position.set(0, 0, -0.82);
propGrp.add(new THREE.Mesh(
  new THREE.BoxGeometry(0.78, 0.025, 0.06),
  new THREE.MeshStandardMaterial({ color:0x1a1a1a, transparent:true, opacity:0.62 })
));
droneGroup.add(propGrp);

// Landing gear
const gMat = new THREE.MeshStandardMaterial({ color:0x444444 });
[-0.22, 0.22].forEach(x => {
  const s = new THREE.Mesh(new THREE.CylinderGeometry(0.015,0.015,0.22,6), gMat);
  s.position.set(x, -0.18, 0.04); droneGroup.add(s);
  const w = new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.055,0.04,12), gMat);
  w.rotation.z = Math.PI/2; w.position.set(x, -0.3, 0.04); droneGroup.add(w);
});
const ts = new THREE.Mesh(new THREE.CylinderGeometry(0.01,0.01,0.12,6), gMat);
ts.position.set(0, -0.12, 0.63); droneGroup.add(ts);

// FPV mount at nose
const fpvMount = new THREE.Object3D();
fpvMount.position.set(0, 0.05, -0.83); droneGroup.add(fpvMount);

droneGroup.position.set(-100, 0.3, 0);
scene.add(droneGroup);

// ═══════════════════════════════════════════════════════════════
//  CAMERAS
// ═══════════════════════════════════════════════════════════════
const opCam  = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 1200);
opCam.position.set(0, 1.7, OP_Z);

const fpvCam = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.05, 1200);

const topCam = new THREE.OrthographicCamera(-220, 220, 220, -220, 1, 2000);
topCam.position.set(0, 500, 0);
topCam.up.set(0, 0, -1);   // north (-Z) points up in top-down view
topCam.lookAt(0, 0, 0);

// ═══════════════════════════════════════════════════════════════
//  DEMO STATE
// ═══════════════════════════════════════════════════════════════
let playing      = true;
let mainCam      = 'op';
let wpIdx        = 0;
let wpProg       = 0;     // 0..1 progress along current flying segment
let waitAccum    = 0;     // time spent at current static waypoint
let calloutShown = false; // has this waypoint's callout been shown yet?

let dronePos   = new THREE.Vector3(-100, 0.3, 0);
let droneYaw   = Math.PI/2;   // facing east (+X) at start
let dronePitch = 0;
let droneRoll  = 0;
let prevYaw    = Math.PI/2;
let inspAngle  = 0;

function curStepId() { return SEQ[wpIdx] ? SEQ[wpIdx].s : 'A'; }

function showCallout(txt, hi) {
  const el = document.getElementById('callout');
  el.textContent = txt;
  el.className = hi ? 'hi' : '';
}

// ── Step list UI ─────────────────────────────────────────────
const panel = document.getElementById('steps');
STEP_DEFS.forEach(sd => {
  const div = document.createElement('div');
  div.className = 's-item si'; div.dataset.sid = sd.id;
  div.innerHTML = `<span class="sid">${sd.id}</span>${sd.lbl}`;
  div.onclick = () => jumpToStep(sd.id);
  panel.appendChild(div);
});

function updateStepUI(sid) {
  document.querySelectorAll('.si').forEach(el =>
    el.classList.toggle('on', el.dataset.sid === sid));
}

function jumpToStep(sid) {
  const idx = SEQ.findIndex(w => w.s === sid);
  if (idx < 0) return;
  wpIdx = idx; wpProg = 0; waitAccum = 0; calloutShown = false;
  const wp = SEQ[idx];
  dronePos.set(...wp.p);
  // point drone toward next waypoint on arrival
  const nxt = SEQ[Math.min(idx+1, SEQ.length-1)];
  if (nxt && nxt.v > 0) {
    const dx = nxt.p[0]-wp.p[0], dz = nxt.p[2]-wp.p[2];
    if (Math.abs(dx)+Math.abs(dz) > 0.1) droneYaw = Math.atan2(dx, -dz);
  }
  prevYaw = droneYaw; droneRoll = 0; dronePitch = 0;
}

function stepNav(dir) {
  const ids = STEP_DEFS.map(s => s.id);
  const ci  = ids.indexOf(curStepId());
  const ni  = Math.max(0, Math.min(ids.length-1, ci+dir));
  if (ni !== ci) jumpToStep(ids[ni]);
}

function togglePlay() {
  playing = !playing;
  document.getElementById('bPlay').textContent = playing ? '⏸ 暫停' : '▶ 繼續';
}

// ── Camera switching ─────────────────────────────────────────
function setMainCam(type) {
  mainCam = type;
  document.querySelectorAll('.cb').forEach(b => b.classList.remove('on'));
  const btn = document.getElementById('cam-'+type);
  if (btn) btn.classList.add('on');
  document.getElementById('fpvhud').style.display = (type==='fpv') ? 'block' : 'none';
  layoutPip();
}

function pipSize() { return Math.min(Math.floor(innerWidth*0.22), 210); }

function layoutPip() {
  const W=innerWidth, H=innerHeight, SZ=pipSize(), M=8;
  const splitMode = (mainCam==='all');

  // PiP frames (shown only in non-split mode)
  const pf1=document.getElementById('pf1'), pf2=document.getElementById('pf2');
  const pl1=document.getElementById('pl1'), pl2=document.getElementById('pl2');
  if (splitMode) {
    [pf1,pf2,pl1,pl2].forEach(e=>e.style.display='none');
    // Show split labels
    const lW=Math.floor(W*0.6), rW=W-lW, hH=Math.floor(H/2);
    const sl_op=document.getElementById('sl-op');
    const sl_top=document.getElementById('sl-top');
    const sl_fpv=document.getElementById('sl-fpv');
    sl_op.style.cssText  = `display:block;left:8px;bottom:8px`;
    sl_top.style.cssText = `display:block;left:${lW+6}px;top:${hH+6}px`;
    sl_fpv.style.cssText = `display:block;left:${lW+6}px;bottom:8px`;
  } else {
    ['sl-op','sl-top','sl-fpv'].forEach(id=>document.getElementById(id).style.display='none');
    const rx = W-SZ-M, ry1 = M, ry2 = M+SZ+M;
    pf1.style.cssText = `display:block;right:${M}px;top:${ry1}px;width:${SZ}px;height:${SZ}px`;
    pf2.style.cssText = `display:block;right:${M}px;top:${ry2}px;width:${SZ}px;height:${SZ}px`;
    pl1.style.cssText = `display:block;right:${M+3}px;top:${ry1+3}px`;
    pl2.style.cssText = `display:block;right:${M+3}px;top:${ry2+3}px`;
    pl1.textContent = '上視圖';
    pl2.textContent = (mainCam==='op') ? '無人機視角' : '操作者視角';
  }
}
layoutPip();

// ═══════════════════════════════════════════════════════════════
//  DEMO AUTOPILOT UPDATE
// ═══════════════════════════════════════════════════════════════
function lerpAngle(a, b, t) {
  let d = b - a;
  while (d >  Math.PI) d -= Math.PI*2;
  while (d < -Math.PI) d += Math.PI*2;
  return a + d * Math.min(t, 1);
}

function update(dt) {
  if (!playing) return;
  const wp = SEQ[wpIdx];
  if (!wp) return;

  updateStepUI(wp.s);

  // 360° inspector ring animation (steps A and F while drone is stationary)
  const is360 = (wp.s==='A' || wp.s==='F') && wp.v===0;
  if (is360) {
    inspAngle -= dt * 0.85;   // counterclockwise
    const r = 3.2;
    inspector.position.set(
      dronePos.x + r*Math.cos(inspAngle), 0.45,
      dronePos.z + r*Math.sin(inspAngle));
    inspector.visible = true;
  } else {
    inspector.visible = false;
  }

  // Show callout once when arriving at this waypoint
  if (wp.t && !calloutShown) {
    showCallout(wp.t, wp.hi);
    calloutShown = true;
  }

  // ── Static waypoint ──────────────────────────────────────
  if (wp.v === 0) {
    waitAccum += dt;
    if (waitAccum >= (wp.d || 2.5)) {
      wpIdx = (wpIdx+1) % SEQ.length;
      wpProg=0; waitAccum=0; calloutShown=false;
    }
    // Keep pitch/roll neutral on the ground
    dronePitch = THREE.MathUtils.lerp(dronePitch, 0, dt*3);
    droneRoll  = THREE.MathUtils.lerp(droneRoll,  0, dt*3);
    return;
  }

  // ── Flying waypoint ───────────────────────────────────────
  const nxt = SEQ[Math.min(wpIdx+1, SEQ.length-1)];
  const startP = new THREE.Vector3(...wp.p);
  const endP   = new THREE.Vector3(...nxt.p);
  const segLen = startP.distanceTo(endP);

  if (segLen < 0.5) {
    wpIdx = Math.min(wpIdx+1, SEQ.length-1);
    wpProg=0; waitAccum=0; calloutShown=false; return;
  }

  wpProg += (wp.v * dt) / segLen;

  if (wpProg >= 1) {
    dronePos.copy(endP);
    wpIdx = Math.min(wpIdx+1, SEQ.length-1);
    wpProg=0; waitAccum=0; calloutShown=false;
  } else {
    dronePos.lerpVectors(startP, endP, wpProg);

    // Heading (yaw) from segment direction
    const dir = new THREE.Vector3().subVectors(endP, startP).normalize();
    if (Math.abs(dir.x)+Math.abs(dir.z) > 0.01) {
      const tYaw = Math.atan2(dir.x, -dir.z);
      droneYaw = lerpAngle(droneYaw, tYaw, dt*2.5);
    }

    // Pitch from altitude gradient
    const altDelta = endP.y - startP.y;
    const horizDist = Math.sqrt(dir.x*dir.x + dir.z*dir.z) * segLen;
    const tPitch = THREE.MathUtils.clamp(Math.atan2(altDelta, horizDist*0.5), -0.42, 0.42);
    dronePitch = THREE.MathUtils.lerp(dronePitch, tPitch, dt*2);

    // Bank from yaw-rate (smooth angle difference)
    let yawDelta = droneYaw - prevYaw;
    while (yawDelta >  Math.PI) yawDelta -= Math.PI*2;
    while (yawDelta < -Math.PI) yawDelta += Math.PI*2;
    const yawRate = yawDelta / Math.max(dt, 0.001);
    const tRoll = THREE.MathUtils.clamp(yawRate * 1.4, -0.58, 0.58);
    droneRoll = THREE.MathUtils.lerp(droneRoll, tRoll, dt*3);
    prevYaw = droneYaw;
  }
}

// ═══════════════════════════════════════════════════════════════
//  MULTI-VIEWPORT RENDER
// ═══════════════════════════════════════════════════════════════
function renderView(cam, vx, vy, vw, vh, bgColor) {
  renderer.setViewport(vx, vy, vw, vh);
  renderer.setScissor(vx, vy, vw, vh);
  renderer.setClearColor(bgColor);
  renderer.clear(true, true, false);
  if (cam instanceof THREE.PerspectiveCamera) {
    cam.aspect = vw/vh; cam.updateProjectionMatrix();
  }
  renderer.render(scene, cam);
}

function renderAll() {
  const W=innerWidth, H=innerHeight, SZ=pipSize(), M=8;
  renderer.setScissorTest(true);

  if (mainCam === 'all') {
    // Three-way split: left 60% = operator, top-right = top-down, bot-right = FPV
    const lW=Math.floor(W*0.6), rW=W-lW, hH=Math.floor(H/2);
    renderView(opCam,  0,   0,   lW, H,   0x87ceeb);
    // Top-down orthographic (right-top)
    const orthoSpan = lW * 0.5;
    topCam.left=-orthoSpan; topCam.right=orthoSpan;
    topCam.top=hH*0.5; topCam.bottom=-hH*0.5;
    topCam.updateProjectionMatrix();
    renderView(topCam, lW, hH, rW, hH, 0x2d5520);
    renderView(fpvCam, lW, 0,  rW, hH, 0x87ceeb);
  } else {
    // Main view
    const mainCamera = mainCam==='fpv' ? fpvCam : (mainCam==='top' ? topCam : opCam);
    renderView(mainCamera, 0, 0, W, H, 0x87ceeb);

    // PiP 1: top-down  (upper-right)
    //  In WebGL the y=0 is the BOTTOM of the canvas, so:
    //  top-right CSS pixel (x=W-SZ-M, y=M) → WebGL y = H - M - SZ
    const p1x = W-SZ-M,  p1y = H-M-SZ;
    topCam.left=-220; topCam.right=220; topCam.top=220; topCam.bottom=-220;
    topCam.updateProjectionMatrix();
    renderView(topCam, p1x, p1y, SZ, SZ, 0x2a5a18);

    // PiP 2: secondary cam  (below pip1)
    const p2y = H - M - SZ - M - SZ;
    const pip2cam = (mainCam==='op') ? fpvCam : opCam;
    renderView(pip2cam, p1x, p2y, SZ, SZ, 0x87ceeb);
  }
}

// ═══════════════════════════════════════════════════════════════
//  ANIMATION LOOP
// ═══════════════════════════════════════════════════════════════
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  update(dt);

  // Apply drone transform
  droneGroup.position.copy(dronePos);
  droneGroup.rotation.set(dronePitch, -droneYaw, -droneRoll, 'YXZ');

  // Propeller spin (faster in-flight)
  propGrp.rotation.z += (dronePos.y < 1 ? 6 : 38) * dt;

  // ── Operator cam: fixed at ground, tracks drone ──────────
  opCam.position.set(0, 1.7, OP_Z);
  opCam.lookAt(dronePos.x, dronePos.y, dronePos.z);

  // ── FPV cam: attached to nose mount ──────────────────────
  const noseWorld = new THREE.Vector3();
  fpvMount.getWorldPosition(noseWorld);
  fpvCam.position.copy(noseWorld);
  const fwdWorld = new THREE.Vector3(0, 0, -1).applyQuaternion(droneGroup.quaternion);
  fpvCam.lookAt(noseWorld.clone().add(fwdWorld.multiplyScalar(40)));

  // ── Top-down cam: follows drone horizontally ─────────────
  topCam.position.set(dronePos.x, 500, dronePos.z);
  topCam.lookAt(dronePos.x, 0, dronePos.z);

  // ── Ground shadow ────────────────────────────────────────
  gShadow.position.set(dronePos.x, 0.06, dronePos.z);
  const h  = Math.max(0.5, dronePos.y);
  const sc = 1 + h*0.045;
  gShadow.scale.set(sc, sc, sc);
  gShadow.material.opacity = Math.max(0.02, 0.26 - h*0.004);

  // ── Status bar ───────────────────────────────────────────
  document.getElementById('sAlt').textContent = Math.max(0, dronePos.y - 0.3).toFixed(1);
  document.getElementById('sSpd').textContent = (SEQ[wpIdx]?.v || 0).toFixed(0);
  const yd = (((droneYaw*180/Math.PI) % 360) + 360) % 360;
  document.getElementById('sHdg').textContent = yd.toFixed(0).padStart(3, '0');

  renderAll();
}

// ═══════════════════════════════════════════════════════════════
//  RESIZE
// ═══════════════════════════════════════════════════════════════
window.addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  layoutPip();
});

// ── Boot ──────────────────────────────────────────────────────
jumpToStep('A');
showCallout('點擊左側項目可跳到任意測驗步驟\n▶ 繼續 / ⏸ 暫停 控制播放', false);
animate();
</script>
